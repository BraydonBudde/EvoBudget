<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ultimate Budget Planner — Ezzo Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css?v=20261190"/>
  <script>
    // Apply the saved theme before any content paints. init() also does this,
    // but only once the whole script has loaded and run - long enough for the
    // static "dark" default above to flash first for anyone on another theme
    // (including someone arriving from a themed demo link).
    (function () {
      try {
        var th = localStorage.getItem('evobudget_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', th === 'terminal' ? 'jolly' : th === 'minimal' ? 'peachy' : th === 'synthwave' ? 'dark' : th);
      } catch (e) {}
    })();
  </script>

  <style>
    /* ── The opening: the EzzoHub mark builds itself while the planner gets ready ──
       Painted before anything else, so the planner is only ever seen finished.
       Always on the dark sky, whatever the theme. The story, in about 1.8s:
       a drop falls into a hexagon and becomes the tile, a shockwave rings out,
       the E and H faces spin in with motion trails, the four top tiles land one
       by one, sparks fly, and the name types in. It leaves by closing in on the logo. */
    .ez-splash {
      --ezs-bg: #0f0a24; --ezs-tile: linear-gradient(160deg, #b9a3fc, #8b5cf6 62%, #6d3fe0); --ezs-ink: #f5f2ff; --ezs-sub: rgba(245, 242, 255, .55);
      --ezs-r1: #c4b5fd; --ezs-r2: #ec4899; --ezs-glow: rgba(139, 92, 246, .5);
      --ezs-in: cubic-bezier(.22, 1, .36, 1); --ezs-pop: cubic-bezier(.3, 1.45, .5, 1);
      position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; align-content: center; gap: 46px;
      background: var(--ezs-bg); overflow: hidden;
    }
    .ez-splash[hidden] { display: none; }
    .ez-splash-glow { position: absolute; width: 560px; height: 560px; left: 50%; top: 50%; margin: -320px 0 0 -280px; border-radius: 50%; background: radial-gradient(circle, var(--ezs-glow), transparent 62%); opacity: 0; }
    .ez-splash-stage { position: relative; width: 156px; height: 156px; display: grid; place-items: center; }
    .ez-splash-fx { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); overflow: visible; pointer-events: none; }
    .ez-splash-fx * { fill: none; stroke-linecap: round; stroke-linejoin: round; transform-box: fill-box; transform-origin: center; }
    .ezs-target { stroke: var(--ezs-r1); stroke-width: 2.4; stroke-dasharray: 100; stroke-dashoffset: 100; }
    .ezs-wave { stroke: var(--ezs-r1); stroke-width: 1.6; opacity: 0; }
    .ezs-frame { stroke: url(#ezsRing); stroke-width: 2.2; stroke-dasharray: 100; stroke-dashoffset: 100; }
    .ezs-sparks line { stroke: var(--ezs-r1); stroke-width: 2.6; stroke-dasharray: 26 100; stroke-dashoffset: 26; opacity: 0; }
    .ezs-sparks line:nth-child(even) { stroke: var(--ezs-r2); stroke-width: 2; }
    .ez-splash-tile {
      position: relative; width: 104px; height: 104px; border-radius: 28.8%; overflow: hidden;
      background: var(--ezs-tile); box-shadow: 0 30px 60px -24px var(--ezs-glow), inset 0 1px 0 rgba(255, 255, 255, .35); opacity: 0;
    }
    .ez-splash-sheen { position: absolute; inset: -20%; background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .55) 50%, transparent 62%); transform: translateX(-120%); }
    /* The mark, cut into the six pieces it is drawn from. */
    .ezs-mark { position: absolute; left: 50%; top: 50%; width: 69px; height: 69px; margin: -34.5px 0 0 -34.5px; }
    .ezs-p { position: absolute; inset: 0; background: url(branding/ezzo-mark-white.png) center / 100% 100% no-repeat; opacity: 0; }
    .ezs-p--t1 { clip-path: polygon(50% -2%, 72.7% 12.1%, 50% 24.2%, 27.3% 12.1%); }
    .ezs-p--t2 { clip-path: polygon(27.3% 12.1%, 50% 24.2%, 28.1% 35.9%, 5.5% 24.2%); }
    .ezs-p--t3 { clip-path: polygon(72.7% 12.1%, 94.5% 24.2%, 71.9% 35.9%, 50% 24.2%); }
    .ezs-p--t4 { clip-path: polygon(50% 24.2%, 71.9% 35.9%, 50% 47.7%, 28.1% 35.9%); }
    .ezs-p--e { clip-path: polygon(0 21.9%, 50% 46.9%, 50% 100%, 0 100%); }
    .ezs-p--h { clip-path: polygon(50% 46.9%, 100% 21.9%, 100% 100%, 50% 100%); }
    .ez-splash-word { text-align: center; font-family: 'Sora', 'Inter', system-ui, sans-serif; }
    .ez-splash-word b { display: block; font-size: 19px; font-weight: 700; letter-spacing: .02em; color: var(--ezs-ink); overflow: hidden; padding: 2px 0; white-space: pre; }
    .ez-splash-word b i { display: inline-block; font-style: normal; opacity: 0; }
    .ez-splash-word span { display: block; margin-top: 4px; font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--ezs-sub); opacity: 0; }

    .ez-splash.is-play .ez-splash-glow { animation: ezsGlow 1.3s var(--ezs-in) .3s forwards; }
    .ez-splash.is-play .ez-splash-tile { animation: ezsTile 1s linear forwards; }
    .ez-splash.is-play .ezs-target { animation: ezsTarget .9s linear forwards; }
    .ez-splash.is-play .ezs-wave--1 { animation: ezsWave .75s var(--ezs-in) .44s forwards; }
    .ez-splash.is-play .ezs-wave--2 { animation: ezsWave .8s var(--ezs-in) 1.12s forwards; }
    .ez-splash.is-play .ezs-frame { animation: ezsFrame .9s var(--ezs-in) .7s forwards; }
    .ez-splash.is-play .ezs-sparks line { animation: ezsSpark .55s var(--ezs-in) 1.14s forwards; }
    .ez-splash.is-play .ezs-p--e { animation: ezsFaceL .62s var(--ezs-in) .5s forwards; }
    .ez-splash.is-play .ezs-p--h { animation: ezsFaceR .62s var(--ezs-in) .56s forwards; }
    .ez-splash.is-play .ezs-ghost.ezs-p--e { animation-name: ezsGhostL; }
    .ez-splash.is-play .ezs-ghost.ezs-p--h { animation-name: ezsGhostR; }
    .ez-splash.is-play .ezs-ghost--1 { animation-delay: .56s; }
    .ez-splash.is-play .ezs-ghost--2 { animation-delay: .62s; }
    .ez-splash.is-play .ezs-ghost--1.ezs-p--h { animation-delay: .62s; }
    .ez-splash.is-play .ezs-ghost--2.ezs-p--h { animation-delay: .68s; }
    .ez-splash.is-play .ezs-p--t1, .ez-splash.is-play .ezs-p--t2, .ez-splash.is-play .ezs-p--t3, .ez-splash.is-play .ezs-p--t4 { animation: ezsTop .5s var(--ezs-pop) forwards; }
    .ez-splash.is-play .ezs-p--t2 { animation-delay: .84s; }
    .ez-splash.is-play .ezs-p--t1 { animation-delay: .9s; }
    .ez-splash.is-play .ezs-p--t4 { animation-delay: .96s; }
    .ez-splash.is-play .ezs-p--t3 { animation-delay: 1.02s; }
    .ez-splash.is-play .ez-splash-sheen { animation: ezsSheen .7s ease-in-out 1.22s forwards; }
    .ez-splash.is-play .ez-splash-word b i { animation: ezsChar .5s var(--ezs-in) calc(.98s + var(--i) * 22ms) forwards; }
    .ez-splash.is-play .ez-splash-word span { animation: ezsBy .6s var(--ezs-in) 1.34s forwards; }
    .ez-splash.is-replay { animation: ezsIn .32s ease-out; }
    .ez-splash.is-out { animation: ezsClose .62s cubic-bezier(.7, 0, .2, 1) forwards; }
    .ez-splash.is-out .ez-splash-stage { animation: ezsShrink .62s cubic-bezier(.7, 0, .2, 1) forwards; }
    .ez-splash.is-out .ez-splash-word { animation: ezsWordOut .3s ease-in forwards; }

    @keyframes ezsGlow { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
    /* A drop falls, stretches, squashes on landing, then swells into the tile. */
    @keyframes ezsTile {
      0% { opacity: 0; transform: translateY(-150px) scale(.13); border-radius: 50%; animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
      6% { opacity: 1; }
      30% { transform: translateY(0) scale(.1, .22); border-radius: 50%; animation-timing-function: cubic-bezier(0, 0, .3, 1); }
      38% { transform: translateY(5px) scale(.23, .09); border-radius: 50%; animation-timing-function: cubic-bezier(.3, 0, .3, 1); }
      47% { opacity: 1; transform: translateY(0) scale(.14); border-radius: 50%; animation-timing-function: cubic-bezier(.3, 1.3, .5, 1); }
      74% { transform: scale(1.07) rotate(-4deg); border-radius: 26%; animation-timing-function: ease-in-out; }
      86% { transform: scale(.985) rotate(1deg); }
      100% { opacity: 1; transform: none; border-radius: 28.8%; }
    }
    /* The little hexagon the drop lands in, which then bursts outward. */
    @keyframes ezsTarget {
      0% { stroke-dashoffset: 100; opacity: 1; transform: scale(1); }
      38% { stroke-dashoffset: 0; transform: scale(1); }
      47% { transform: scale(.78); opacity: 1; }
      100% { stroke-dashoffset: 0; transform: scale(4.6) rotate(30deg); opacity: 0; }
    }
    @keyframes ezsWave { 0% { opacity: .9; transform: scale(.5); stroke-width: 4; } 100% { opacity: 0; transform: scale(1.9) rotate(-20deg); stroke-width: .5; } }
    @keyframes ezsFrame { from { stroke-dashoffset: 100; transform: rotate(-90deg) scale(.9); opacity: 0; } 20% { opacity: 1; } to { stroke-dashoffset: 0; transform: none; opacity: .55; } }
    @keyframes ezsSpark { 0% { opacity: 1; stroke-dashoffset: 26; } 100% { opacity: 0; stroke-dashoffset: -74; } }
    @keyframes ezsFaceL {
      0% { opacity: 0; transform: translate(-74px, 44px) rotate(-48deg) scale(.55); }
      18% { opacity: 1; }
      68% { transform: translate(2px, -1px) rotate(3deg) scale(1.03); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes ezsFaceR {
      0% { opacity: 0; transform: translate(74px, 44px) rotate(48deg) scale(.55); }
      18% { opacity: 1; }
      68% { transform: translate(-2px, -1px) rotate(-3deg) scale(1.03); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes ezsGhostL {
      0% { opacity: 0; transform: translate(-74px, 44px) rotate(-48deg) scale(.55); }
      18% { opacity: .38; }
      68% { opacity: 0; transform: translate(2px, -1px) rotate(3deg) scale(1.03); }
      100% { opacity: 0; transform: none; }
    }
    @keyframes ezsGhostR {
      0% { opacity: 0; transform: translate(74px, 44px) rotate(48deg) scale(.55); }
      18% { opacity: .38; }
      68% { opacity: 0; transform: translate(-2px, -1px) rotate(-3deg) scale(1.03); }
      100% { opacity: 0; transform: none; }
    }
    @keyframes ezsTop { 0% { opacity: 0; transform: translateY(-30px) scale(.35); } 40% { opacity: 1; } 100% { opacity: 1; transform: none; } }
    @keyframes ezsSheen { to { transform: translateX(120%); } }
    @keyframes ezsChar { from { opacity: 0; transform: translateY(105%) rotate(10deg); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes ezsBy { from { opacity: 0; letter-spacing: .85em; } to { opacity: 1; letter-spacing: .3em; } }
    @keyframes ezsIn { from { opacity: 0; } to { opacity: 1; } }
    /* Leaving: the screen closes in on the logo, uncovering the planner around it. */
    @keyframes ezsClose { 0% { clip-path: circle(150% at 50% 46%); } 100% { clip-path: circle(0% at 50% 46%); visibility: hidden; } }
    @keyframes ezsShrink { 0% { transform: none; } 30% { transform: scale(1.06); } 100% { transform: scale(.35) rotate(-12deg); opacity: 0; } }
    @keyframes ezsWordOut { to { opacity: 0; transform: translateY(-8px); filter: blur(4px); } }
    @media (prefers-reduced-motion: reduce) {
      .ez-splash *, .ez-splash { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }
  </style>
</head>
<body>

  <!-- The opening: shown until the planner is ready (see ezzoSplash below). -->
  <div class="ez-splash is-play" id="ezSplash" role="status" aria-label="Opening Ultimate Budget Planner">
    <div class="ez-splash-glow" aria-hidden="true"></div>
    <div class="ez-splash-stage" aria-hidden="true">
      <svg class="ez-splash-fx" viewBox="0 0 236 236">
        <defs><linearGradient id="ezsRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ezs-r1)"/><stop offset="1" stop-color="var(--ezs-r2)"/></linearGradient></defs>
        <polygon class="ezs-frame" points="118.0,26.0 197.7,72.0 197.7,164.0 118.0,210.0 38.3,164.0 38.3,72.0" pathLength="100"/>
        <polygon class="ezs-wave ezs-wave--1" points="118.0,52.0 175.2,85.0 175.2,151.0 118.0,184.0 60.8,151.0 60.8,85.0"/>
        <polygon class="ezs-wave ezs-wave--2" points="118.0,38.0 187.3,78.0 187.3,158.0 118.0,198.0 48.7,158.0 48.7,78.0"/>
        <polygon class="ezs-target" points="118.0,101.0 132.7,109.5 132.7,126.5 118.0,135.0 103.3,126.5 103.3,109.5" pathLength="100"/>
        <g class="ezs-sparks"><line x1="204.0" y1="118.0" x2="230.0" y2="118.0" pathLength="100"/><line x1="192.5" y1="161.0" x2="215.0" y2="174.0" pathLength="100"/><line x1="161.0" y1="192.5" x2="174.0" y2="215.0" pathLength="100"/><line x1="118.0" y1="204.0" x2="118.0" y2="230.0" pathLength="100"/><line x1="75.0" y1="192.5" x2="62.0" y2="215.0" pathLength="100"/><line x1="43.5" y1="161.0" x2="21.0" y2="174.0" pathLength="100"/><line x1="32.0" y1="118.0" x2="6.0" y2="118.0" pathLength="100"/><line x1="43.5" y1="75.0" x2="21.0" y2="62.0" pathLength="100"/><line x1="75.0" y1="43.5" x2="62.0" y2="21.0" pathLength="100"/><line x1="118.0" y1="32.0" x2="118.0" y2="6.0" pathLength="100"/><line x1="161.0" y1="43.5" x2="174.0" y2="21.0" pathLength="100"/><line x1="192.5" y1="75.0" x2="215.0" y2="62.0" pathLength="100"/></g>
      </svg>
      <div class="ez-splash-tile"><i class="ez-splash-sheen"></i></div>
      <div class="ezs-mark">
        <i class="ezs-p ezs-p--e ezs-ghost ezs-ghost--2"></i><i class="ezs-p ezs-p--e ezs-ghost ezs-ghost--1"></i><i class="ezs-p ezs-p--e"></i>
        <i class="ezs-p ezs-p--h ezs-ghost ezs-ghost--2"></i><i class="ezs-p ezs-p--h ezs-ghost ezs-ghost--1"></i><i class="ezs-p ezs-p--h"></i>
        <i class="ezs-p ezs-p--t1"></i><i class="ezs-p ezs-p--t2"></i><i class="ezs-p ezs-p--t3"></i><i class="ezs-p ezs-p--t4"></i>
      </div>
    </div>
    <div class="ez-splash-word" aria-hidden="true"><b><i style="--i:0">U</i><i style="--i:1">l</i><i style="--i:2">t</i><i style="--i:3">i</i><i style="--i:4">m</i><i style="--i:5">a</i><i style="--i:6">t</i><i style="--i:7">e</i><i style="--i:8"> </i><i style="--i:9">B</i><i style="--i:10">u</i><i style="--i:11">d</i><i style="--i:12">g</i><i style="--i:13">e</i><i style="--i:14">t</i></b><span>by Ezzo</span></div>
  </div>
  <script>
    // The opening stays until it has finished building (about 1.9s), and
    // leaves as soon as the planner says it is ready. play() runs it again
    // over a change of screen, such as the end of setup.
    (function () {
      var el = document.getElementById('ezSplash');
      if (!el) return;
      var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var MIN = still ? 150 : 1900, t0 = Date.now(), gone = false, safety;
      function hide() {
        if (gone) return;
        gone = true; clearTimeout(safety);
        setTimeout(function () {
          el.classList.add('is-out');
          setTimeout(function () { el.hidden = true; el.classList.remove('is-out', 'is-replay'); }, still ? 0 : 640);
        }, Math.max(0, MIN - (Date.now() - t0)));
      }
      window.ezzoSplash = {
        done: hide,
        play: function (under) {
          gone = false; t0 = Date.now();
          el.hidden = false;
          el.classList.remove('is-out', 'is-play', 'is-replay');
          void el.offsetWidth;
          el.classList.add('is-play', 'is-replay');
          // Change the screen underneath once it is covered, then leave.
          setTimeout(function () { try { under && under(); } catch (e) {} hide(); }, still ? 0 : 340);
        }
      };
      // Never leave anyone staring at the logo if something upstream stalls.
      safety = setTimeout(hide, 6000);
    })();
  </script>

  <!-- Lighting for the sculpted appearances (Jolly, Peachy, Frosty): bevels charts,
       lit from the top left. Referenced by CSS as url(#clayFx). -->
  <svg class="clay-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <filter id="clayFx" x="-15%" y="-15%" width="130%" height="140%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="blur"/>
        <feSpecularLighting in="blur" surfaceScale="2.6" specularConstant=".62" specularExponent="16" lighting-color="#ffffff" result="spec">
          <feDistantLight azimuth="225" elevation="42"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="lit"/>
        <feOffset in="blur" dx="-2.5" dy="-3" result="shift"/>
        <feComposite in="SourceAlpha" in2="shift" operator="out" result="rim"/>
        <feFlood flood-color="#4a3048" flood-opacity=".24"/>
        <feComposite in2="rim" operator="in" result="shade"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="lit"/></feMerge>
      </filter>
      <filter id="clayFxThin" x="-5%" y="-15%" width="110%" height="140%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
        <feSpecularLighting in="blur" surfaceScale="1.8" specularConstant=".7" specularExponent="18" lighting-color="#ffffff" result="spec">
          <feDistantLight azimuth="225" elevation="45"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="lit"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="lit"/></feMerge>
      </filter>
    </defs>
  </svg>

  <div class="backdrop" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <div class="app tool-shell" id="app">

    <div class="tool-sticky">
    <header class="topbar tool-topbar">
      <div class="tool-topbar-left">
        <button class="btn-icon" id="backToHub" type="button" aria-label="Dashboard" title="Dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
            <path d="M9 21V12h6v9"/>
          </svg>
        </button>
        <button class="btn-icon" id="guideNavBtn" type="button" aria-label="Guide">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2z"/>
            <path d="M22 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22z"/>
          </svg>
        </button>
      </div>
      <div class="wordmark wordmark-sm">
        <div class="wordmark-icon wordmark-icon-sm ubp-icon">
          <img class="ubp-logo" src="branding/ezzo-mark-white.png" alt="" width="20" height="20" decoding="async">
        </div>
        <span class="app-title-editable" id="appTitleText" role="button" tabindex="0" title="Rename">Ultimate Budget</span>
      </div>
      <div class="tool-topbar-right">
        <button class="penny-nav-btn penny-off" id="pennyNavBtn" type="button" aria-label="Ask Ezzo">
          <span class="penny-nav-btn-inner">
            <!-- "Sparkles" glyph (large star + two satellites): reads as an AI
                 assistant, not as a "+" quick-add button the way a lone
                 4-point star did at this size. -->
            <span class="penny-nav-icon">
              <svg width="24" height="24" viewBox="2 0 20 20" fill="currentColor" stroke="none">
                <path d="M10 4l1.5 4.1 4.1 1.5-4.1 1.5L10 15.2 8.5 11.1 4.4 9.6l4.1-1.5L10 4z"/>
                <path d="M17 3l.75 2.05L19.8 5.8l-2.05.75L17 8.6l-.75-2.05L14.2 5.8l2.05-.75L17 3z"/>
                <path d="M16.4 12.6l.6 1.64 1.64.6-1.64.6-.6 1.64-.6-1.64-1.64-.6 1.64-.6.6-1.64z"/>
              </svg>
            </span>
            <span class="penny-nav-pill-text" id="pennyNavPillText">Ask Ezzo</span>
          </span>
