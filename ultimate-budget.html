<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ultimate Budget Planner — Ezzo Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css?v=20261015"/>
  <script>
    // Apply the saved theme before any content paints. init() also does this,
    // but only once the whole script has loaded and run - long enough for the
    // static "dark" default above to flash first for anyone on another theme
    // (including someone arriving from a themed demo link).
    (function () {
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('evobudget_theme') || 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div class="backdrop" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <div class="app tool-shell" id="app">

    <div class="tool-sticky">
    <header class="topbar tool-topbar">
      <div class="tool-topbar-left">
        <button class="btn-icon" id="backToHub" type="button" aria-label="Back to all tools">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
            <path d="M9 21V12h6v9"/>
          </svg>
        </button>
        <button class="btn-icon" id="guideNavBtn" type="button" aria-label="Guide">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2z"/>
            <path d="M22 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22z"/>
          </svg>
        </button>
      </div>
      <div class="wordmark wordmark-sm">
        <div class="wordmark-icon wordmark-icon-sm ubp-icon">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <span class="app-title-editable" id="appTitleText" role="button" tabindex="0" title="Rename">Ultimate Budget</span>
      </div>
      <div class="tool-topbar-right">
        <button class="penny-nav-btn penny-off" id="pennyNavBtn" type="button" aria-label="Enable Ezzo">
          <span class="penny-nav-btn-inner">
            <!-- "Sparkles" glyph (large star + two satellites): reads as an AI
                 assistant, not as a "+" quick-add button the way a lone
                 4-point star did at this size. -->
            <span class="penny-nav-icon">
              <svg width="24" height="24" viewBox="2 0 20 20" fill="currentColor" stroke="none">
                <path d="M10 4l1.5 4.1 4.1 1.5-4.1 1.5L10 15.2 8.5 11.1 4.4 9.6l4.1-1.5L10 4z"/>
                <path d="M17 3l.75 2.05L19.8 5.8l-2.05.75L17 8.6l-.75-2.05L14.2 5.8l2.05-.75L17 3z"/>
                <path d="M16.4 12.6l.6 1.64 1.64.6-1.64.6-.6 1.64-.6-1.64-1.64-.6 1.64-.6.6-1.64z"/>
              </svg>
            </span>
            <span class="penny-nav-pill-text" id="pennyNavPillText">Enable Ezzo</span>
          </span>
        </button>
        <button class="btn-icon" id="settingsNavBtn" type="button" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="budget-tabs" id="ubpTabs" role="tablist" aria-label="Ultimate Budget sections">
      <button class="btab is-active" data-btab="dashboard"     role="tab" type="button">📊 Dashboard</button>
      <button class="btab"           data-btab="budget"        role="tab" type="button">💰 Budget</button>
      <button class="btab"           data-btab="transactions"  role="tab" type="button">📋 Transactions</button>
      <button class="btab"           data-btab="debt"          role="tab" type="button">💳 Debt Payoff</button>
      <button class="btab"           data-btab="subscriptions" role="tab" type="button">🔄 Subscriptions</button>
      <button class="btab"           data-btab="sinking"       role="tab" type="button">🏺 Sinking Funds</button>
      <button class="btab"           data-btab="calendar"      role="tab" type="button">📅 Calendar</button>
    </nav>
    </div>

    <div class="app-scroll">
    <div class="bview is-active" id="bview-dashboard"     role="tabpanel"></div>
    <div class="bview"           id="bview-budget"        role="tabpanel"></div>
    <div class="bview"           id="bview-transactions"  role="tabpanel"></div>
    <div class="bview"           id="bview-debt"          role="tabpanel"></div>
    <div class="bview"           id="bview-sinking"       role="tabpanel"></div>
    <div class="bview"           id="bview-calendar"      role="tabpanel"></div>
    <div class="bview"           id="bview-subscriptions" role="tabpanel"></div>
    <div class="bview"           id="bview-settings"      role="tabpanel"></div>
    </div>

  </div>

  <div class="modal-overlay" id="tutorialOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" id="tutorialModal">
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">×</button>
      <h3 class="modal-title" id="modalTitle"></h3>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="guide-overlay" id="guideOverlay" hidden role="dialog" aria-modal="true" aria-label="Guide">
    <div class="guide-modal" id="guideModal">
      <button class="guide-close" id="guideClose" type="button" aria-label="Close guide">×</button>
      <div class="guide-modal-inner">
        <aside class="guide-sidebar" id="guideSidebar" role="navigation" aria-label="Guide topics"></aside>
        <div class="guide-content" id="guideContent" tabindex="-1"></div>
      </div>
    </div>
  </div>

  <div class="debt-sched-overlay" id="debtSchedOverlay" hidden role="dialog" aria-modal="true" aria-label="Amortization schedule">
    <div class="debt-sched-modal" id="debtSchedModal">
      <button class="guide-close" id="debtSchedClose" type="button" aria-label="Close schedule">×</button>
      <div class="debt-sched-inner">
        <div class="debt-sched-head" id="debtSchedHead"></div>
        <div class="debt-sched-body" id="debtSchedBody" tabindex="-1"></div>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer onload="if(typeof syncPrewarmTokenClient==='function')syncPrewarmTokenClient();"></script>
  <script src="sync.js?v=20261015"></script>
  <script src="charts.js?v=20261015"></script>
  <script src="analytics.js?v=20261015"></script>
  <script src="penny.js?v=20261015"></script>
  <script src="ultimate-budget.js?v=20261015"></script>
</body>
</html>
