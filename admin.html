<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20260830" />
  <link rel="stylesheet" href="admin.css?v=20260830" />
</head>
<body>

  <!-- Ambient gradient backdrop (same as every other page) -->
  <div class="backdrop" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <!-- ═══════════════════ SIGN-IN GATE ═══════════════════
       Shown until a Google session is confirmed to belong to the
       allow-listed owner account. Nothing behind it renders or fetches
       anything until that's true. -->
  <div class="admin-gate" id="adminGate">
    <div class="admin-gate-card panel">
      <div class="wordmark">
        <div class="wordmark-icon">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1" y="7" width="3" height="8" fill="white" rx="1"/>
            <rect x="6" y="4" width="3" height="11" fill="white" rx="1"/>
            <rect x="11" y="1" width="3" height="14" fill="white" rx="1"/>
          </svg>
        </div>
        <span>Analytics</span>
      </div>
      <p class="admin-gate-sub">Private dashboard. Sign in with the site owner's Google account to continue.</p>
      <button class="btn btn-primary btn-lg" id="adminSignInBtn" type="button">Sign in with Google</button>
      <p class="admin-gate-error" id="adminGateError" hidden></p>
    </div>
  </div>

  <!-- ═══════════════════ DASHBOARD ═══════════════════ -->
  <div class="view tool-shell" id="viewAdmin" hidden>
    <div class="tool-sticky">
      <header class="topbar tool-topbar">
        <div class="tool-topbar-left">
          <a class="btn-icon" href="/" aria-label="Back to Ezzo Hub" title="Back to Ezzo Hub">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
              <path d="M9 21V12h6v9"/>
            </svg>
          </a>
          <button class="btn-icon" id="adminRefreshBtn" type="button" aria-label="Refresh data" title="Refresh data">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
            </svg>
          </button>
        </div>
        <div class="wordmark wordmark-sm">
          <div class="wordmark-icon wordmark-icon-sm">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="1" y="7" width="3" height="8" fill="white" rx="1"/>
              <rect x="6" y="4" width="3" height="11" fill="white" rx="1"/>
              <rect x="11" y="1" width="3" height="14" fill="white" rx="1"/>
            </svg>
          </div>
          <span>Analytics</span>
        </div>
        <div class="tool-topbar-right">
          <button class="penny-nav-btn penny-off" id="pennyNavBtn" type="button" aria-label="Enable Ezzo">
            <span class="penny-nav-btn-inner">
              <span class="penny-nav-icon">
                <svg width="24" height="24" viewBox="2 0 20 20" fill="currentColor" stroke="none">
                  <path d="M10 4l1.5 4.1 4.1 1.5-4.1 1.5L10 15.2 8.5 11.1 4.4 9.6l4.1-1.5L10 4z"/>
                  <path d="M17 3l.75 2.05L19.8 5.8l-2.05.75L17 8.6l-.75-2.05L14.2 5.8l2.05-.75L17 3z"/>
                  <path d="M16.4 12.6l.6 1.64 1.64.6-1.64.6-.6 1.64-.6-1.64-1.64-.6 1.64-.6.6-1.64z"/>
                </svg>
              </span>
              <span class="penny-nav-pill-text" id="pennyNavPillText">Enable Ezzo</span>
            </span>
          </button>
          <button class="btn-icon" id="adminSignOutBtn" type="button" aria-label="Sign out" title="Sign out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
            </svg>
          </button>
        </div>
      </header>

      <nav class="budget-tabs" id="adminTabs" role="tablist" aria-label="Analytics sections">
        <button class="btab is-active" data-atab="overview" role="tab" type="button">📊 Overview</button>
        <button class="btab" data-atab="redemptions" role="tab" type="button">🔑 Redemptions</button>
        <button class="btab" data-atab="summary" role="tab" type="button">📝 Summary</button>
        <button class="btab" data-atab="settings" role="tab" type="button">⚙️ Settings</button>
      </nav>
    </div>


    <div class="app-scroll">
      <div class="bview is-active" id="aview-overview" role="tabpanel"></div>
      <div class="bview" id="aview-redemptions" role="tabpanel"></div>
      <div class="bview" id="aview-summary" role="tabpanel"></div>
      <div class="bview" id="aview-settings" role="tabpanel"></div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer onload="if(typeof adminPrewarmTokenClient==='function')adminPrewarmTokenClient();"></script>
  <script src="charts.js?v=20260830"></script>
  <script src="globe.js?v=20260830"></script>
  <!-- penny.js loaded verbatim, unmodified - admin.js (below) defines the
       t()/state/saveState shims it expects, then overrides just its 3
       data-access functions (system instruction, tool declarations, tool
       execution) so she answers analytics questions here instead of
       budget questions. Every other Ezzo mechanic (key vault, streaming,
       model fallback, chat UI, voice) is the exact same code the budget
       tools use. See the "Ezzo integration" section in admin.js. -->
  <script src="penny.js?v=20260830"></script>
  <script src="admin.js?v=20260830"></script>
</body>
</html>
