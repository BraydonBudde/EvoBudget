# Nginx server block for ezzohub.com (static site, no backend, no build step).
# Copy this to /etc/nginx/sites-available/ezzohub.conf on the server, then:
#   sudo ln -s /etc/nginx/sites-available/ezzohub.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # remove the placeholder default site
#   sudo nginx -t && sudo systemctl reload nginx
#
# After this is live over plain HTTP, run certbot (see deploy/README.md) -
# it edits this file in place to add the HTTPS server block and redirect.

server {
    listen 80;
    listen [::]:80;
    server_name ezzohub.com www.ezzohub.com;

    root /var/www/ezzohub;

    # home.html is the real landing page ("Ezzo Hub") - index.html is the
    # Simple Budget Planner tool itself, not the site root, so it must NOT
    # be nginx's default document.
    index home.html;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/ezzohub.access.log;
    error_log  /var/log/nginx/ezzohub.error.log;
}
